<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Bilibili Live Danmaku</title>
    <script src="https://cdn.socket.io/4.1.3/socket.io.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,400;0,600;1,400;1,600&display=swap');

        /*
         * 统一使用 border-box 计算尺寸，避免 body 的内边距和弹幕容器的
         * 内边距把页面实际高度撑到 100vh 之外，造成最底部内容被截断。
         */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: 'Jost', var(--fontstack-sans-serif);
            background-color: rgba(0, 0, 0, 0);
            padding: 20px;
            margin: 0;

            /*
             * 计时器占用自身高度，剩余空间全部交给弹幕容器。
             * min-height: 0 配合 .message-container 的设置，确保容器可以
             * 在视口内正确缩小并产生内部滚动，而不是把整个页面撑高。
             */
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .message-container {
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            background-color: rgba(0, 0, 0, 0);;
            padding: 10px 10px 24px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);

            /* 禁止滚动传递给外层页面，始终只滚动弹幕区域。 */
            overscroll-behavior: contain;

            /* 仍保持原来“看不到滚动条”的外观，但允许程序正常滚动。 */
            scrollbar-width: none;
        }

        .message-container::-webkit-scrollbar {
            display: none;
        }

        .timer-container {
            flex: 0 0 auto;
            z-index: 10;
            background-color: rgba(0, 0, 0, 0);;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .timer {
            font-size: 24px;
            font-weight: bold;
            font-family: 'Jost', var(--fontstack-sans-serif);
            color: transparent;
            background: linear-gradient(45deg, #0000ff, #006400);
            -webkit-background-clip: text;
            background-clip: text;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .message {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            width: fit-content;
            max-width: 100%;
            min-width: 3em;
            margin: 2px 0;
            padding: 2px;

            font-family: 'Jost', var(--fontstack-sans-serif);
            font-size: 25px;
            font-weight: bold;
            color: var(--text);
            background-color: var(--bg);
            border-radius: 5px;
            position: relative;
            filter: drop-shadow(0 0 1px currentColor);
            animation: slideIn 0.5s ease;
        }

        .avatar {
            flex: 0 0 auto;
            width: 30px;
            height: 30px;
            margin-right: 10px;
            border-radius: 50%;
        }

        /*
         * min-width: 0 是弹性布局中允许长文本换行的关键。
         * 如果缺少它，长弹幕可能会把容器撑宽并被 overflow-x 截断。
         */
        .message-main {
            display: flex;
            flex: 1 1 0;
            flex-wrap: wrap;
            align-items: baseline;
            min-width: 0;
        }

        .message strong {
            font-weight: bold;
            background: linear-gradient(45deg, #001f6b, #00c6ff, #8a2be2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .username {
            margin-right: 10px;
            white-space: nowrap;
        }

        .message-text {
            min-width: 0;
            white-space: normal;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .timestamp {
            flex: 0 0 auto;
            font-size: 14px;
            color: #7acca5;
            margin-left: 5px;
            white-space: nowrap;
        }

        #spacer {
            display: none;
        }

        @keyframes slideIn {
            from {
                transform: translateX(-100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="timer-container">
        <div class="timer" id="timer">00:00:00.000</div>
    </div>
    <div class="message-container" id="danmaku-container"></div>
    <div id="spacer"></div>
    <script type="text/javascript">
        var socket = io();
        var displayedTimestamps = {}; // 记录显示过的时间戳
        var startTime;
        var danmakuContainer = document.getElementById('danmaku-container');
        var pendingScrollFrame = null;
        var latestMessageElement = null;

        /*
         * 将滚动安排到浏览器完成本轮排版之后执行。
         * 连续收到多条弹幕时只保留最后一次任务，避免反复滚动和画面抖动。
         * 使用两次 requestAnimationFrame，可以等待新节点插入、文本换行和
         * 元素高度计算完成，再把容器精确移动到 scrollHeight 最底部。
         */
        function scrollDanmakuToBottom() {
            if (pendingScrollFrame !== null) {
                cancelAnimationFrame(pendingScrollFrame);
            }

            pendingScrollFrame = requestAnimationFrame(function() {
                pendingScrollFrame = requestAnimationFrame(function() {
                    danmakuContainer.scrollTop = danmakuContainer.scrollHeight;
                    pendingScrollFrame = null;
                });
            });
        }

        /*
         * 最新一条弹幕可能因字体、头像或窗口宽度变化而再次换行。
         * ResizeObserver 会在它的实际高度变化后补一次滚动，保证最后一行
         * 始终完整显示。每次只观察最新消息，避免弹幕过多时增加额外负担。
         */
        var latestMessageResizeObserver = null;
        if ('ResizeObserver' in window) {
            latestMessageResizeObserver = new ResizeObserver(function() {
                scrollDanmakuToBottom();
            });
        }

        function watchLatestMessage(messageElement) {
            if (latestMessageResizeObserver && latestMessageElement) {
                latestMessageResizeObserver.unobserve(latestMessageElement);
            }

            latestMessageElement = messageElement;

            if (latestMessageResizeObserver) {
                latestMessageResizeObserver.observe(latestMessageElement);
            }

            /* 头像加载完成后，浏览器可能重新排版，再次校正到底部。 */
            var avatar = latestMessageElement.querySelector('.avatar');
            if (avatar) {
                avatar.addEventListener('load', scrollDanmakuToBottom, { once: true });
                avatar.addEventListener('error', scrollDanmakuToBottom, { once: true });
            }
        }

        socket.on('connect', function() {
            console.log('Connected to server');
        });

        socket.on('disconnect', function() {
            console.log('Disconnected from server');
        });

        socket.on('danmaku', function(data) {
            // 检查时间戳是否已显示过
            if (!displayedTimestamps[data.time]) {
                displayedTimestamps[data.time] = true;

                var message = `<div class="message">
                    <img class="avatar" src="${data.avatar}" alt="avatar">
                    <div class="message-main">
                        <strong class="username" style="background: linear-gradient(to right, #ff5e5e, #ffb85e); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 25px;">${data.username}</strong>
                        <span class="message-text" style="font-weight: bold; font-family: 'Arial Black', 'Arial Bold', Gadget, sans-serif; font-size: 25px;">${data.text}</span>
                    </div>
                    <span class="timestamp">${data.time}</span>
                </div>`;
                $('#danmaku-container').append(message);
                var newMessage = $('#danmaku-container .message').last().get(0);

                watchLatestMessage(newMessage);
                scrollDanmakuToBottom();
            }
        });

        /* 窗口大小变化会改变文本换行位置，需要重新对齐最底部。 */
        window.addEventListener('resize', scrollDanmakuToBottom);

        /* Web 字体加载完成后文字宽高可能变化，再执行一次最终校正。 */
        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(scrollDanmakuToBottom);
        }

        function initializeTimer() {
            $.getJSON('/start-time', function(data) {
                startTime = data.start_time * 1000; // 转换为毫秒

                setInterval(function() {
                    var now = new Date().getTime();
                    var elapsedTime = now - startTime;

                    var hours = Math.floor(elapsedTime / (1000 * 60 * 60));
                    var minutes = Math.floor((elapsedTime % (1000 * 60 * 60)) / (1000 * 60));
                    var seconds = Math.floor((elapsedTime % (1000 * 60)) / 1000);
                    var milliseconds = Math.floor(elapsedTime % 1000);

                    hours = hours < 10 ? "0" + hours : hours;
                    minutes = minutes < 10 ? "0" + minutes : minutes;
                    seconds = seconds < 10 ? "0" + seconds : seconds;
                    milliseconds = milliseconds < 100 ? "0" + milliseconds : milliseconds; // 保证毫秒部分为三位数

                    document.getElementById('timer').innerText = hours + ":" + minutes + ":" + seconds + "." + milliseconds;
                }, 10);
            });
        }

        initializeTimer();
    </script>
</body>
</html>
